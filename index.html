<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beyblade X Journey</title>
  <meta name="description" content="Track your Beyblade X tournament journey: tournaments, matches, collection, decks and stats." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app-loading" class="app-loading">
    <div class="spinner"></div>
    <p>Loading…</p>
  </div>

  <!-- ===================== AUTH VIEW ===================== -->
  <section id="auth-view" class="auth-view" hidden>
    <div class="auth-card">
      <div class="brand">
        <span class="brand-x">X</span>
        <div>
          <h1>Beyblade X Journey</h1>
          <p class="tagline">Record every tournament, every match, every combo.</p>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab is-active" data-mode="signin">Sign in</button>
        <button class="auth-tab" data-mode="signup">Create account</button>
      </div>

      <form id="auth-form" class="auth-form" autocomplete="on">
        <label class="field" id="field-name" hidden>
          <span>Blader name</span>
          <input type="text" id="auth-name" placeholder="e.g. Bird" maxlength="40" />
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" id="auth-email" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="auth-password" required minlength="6" autocomplete="current-password" />
        </label>
        <p id="auth-error" class="form-error" role="alert" hidden></p>
        <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Sign in</button>
        <button type="button" id="auth-reset" class="btn-link">Forgot password?</button>
      </form>

      <p id="config-warning" class="config-warning" hidden>
        ⚠️ Firebase is not configured yet. Edit <code>firebase-config.js</code> — see the README.
      </p>
    </div>
  </section>

  <!-- ===================== APP SHELL ===================== -->
  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-x brand-x--sm">X</span>
        <strong>BEYBLADE X<span class="brand-sub">JOURNEY</span></strong>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab is-active" data-view="dashboard">Dashboard</button>
        <button class="tab" data-view="tournaments">Tournaments</button>
        <button class="tab" data-view="matches">Matches</button>
        <button class="tab" data-view="collection">Collection</button>
        <button class="tab" data-view="decks">Decks</button>
      </nav>
      <div class="topbar-user">
        <button id="profile-btn" class="profile-btn" aria-haspopup="true" aria-expanded="false">
          <span class="avatar" id="avatar">–</span>
          <span class="profile-btn-name" id="profile-name"></span>
          <span class="caret">▾</span>
        </button>
        <div id="profile-menu" class="profile-menu" hidden>
          <div class="profile-menu-head">
            <span class="avatar avatar--lg" id="avatar-lg">–</span>
            <div>
              <strong id="pm-name"></strong>
              <span class="muted" id="pm-email"></span>
            </div>
          </div>
          <div class="profile-menu-list">
            <button data-act="edit">Edit profile</button>
            <button data-act="export">Export my data</button>
            <button data-act="reset">Send password reset</button>
          </div>
          <div class="profile-menu-foot">
            <button data-act="signout" class="danger">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <main id="main" class="main"></main>
  </div>

  <!-- ===================== MODAL ===================== -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title">Title</h2>
        <button class="modal-close" data-close aria-label="Close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
